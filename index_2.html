<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F4F3EF">
<title>BlackMonster · Cronograma ao vivo</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Display:ital,wdth,wght@0,62.5,400;0,62.5,500;1,62.5,400&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
:root{--ink:#161513;--ink2:#2B2925;--deep:#0C0B0A;--text:#47443E;--muted:#77726A;--bg:#F4F3EF;--paper:#FFFFFF;--sage:#ECE7DD;--line:rgba(22,21,19,.1);--line2:rgba(22,21,19,.16);--gold:#C9A85C;--gold-d:#A8873F;--gold-t:#8A6D2F;--gold-bg:#FBF6EA;--mb:#3F7D6E;--danger:#B3412B;
 --serif:'Noto Serif Display',Georgia,serif;--sans:'DM Sans',system-ui,-apple-system,sans-serif;--nav:64px}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
a{color:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.serif{font-family:var(--serif);font-stretch:62.5%;font-weight:400;color:var(--ink)}

/* barra superior */
.bar{position:sticky;top:0;z-index:30;background:rgba(244,243,239,.92);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.bar-in{max-width:1100px;margin:0 auto;height:60px;padding:0 20px;display:flex;align-items:center;gap:18px}
.logo{height:17px;width:auto;display:block}
.menu{display:flex;gap:4px;margin-left:10px}
.menu button{padding:8px 14px;border-radius:99px;font-size:14px;font-weight:600;color:var(--muted)}
.menu button.on{background:var(--ink);color:#fff}
.menu button .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--danger);margin-right:7px;vertical-align:1px;animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.35}}
.rt{margin-left:auto;display:flex;align-items:center;gap:12px}
.clk{font-family:var(--serif);font-stretch:62.5%;font-size:28px;color:var(--ink);line-height:1;font-variant-numeric:tabular-nums}
.sync{width:36px;height:36px;border-radius:50%;border:1px solid var(--line2);display:grid;place-items:center;color:var(--gold-d);font-size:16px;position:relative}
.sync i{position:absolute;right:1px;top:1px;width:8px;height:8px;border-radius:50%;background:#4E9A6B;border:2px solid var(--bg)}
.sync.err i{background:var(--danger)}
.sync.load{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.wrap{max-width:1100px;margin:0 auto;padding:22px 20px 60px}
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.kick{display:flex;align-items:center;gap:12px;font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-t)}
.kick::after{content:'';width:40px;height:1px;background:var(--gold)}
.h1{font-family:var(--serif);font-stretch:62.5%;font-size:clamp(38px,5.5vw,58px);line-height:1;color:var(--ink);margin-top:6px}
.h1 em{font-style:italic;color:var(--gold-d)}
.sub{font-size:13.5px;color:var(--muted);margin-top:6px}
.stt{font-size:12px;color:var(--muted)}

/* dias + filtros (sticky) */
.stick{position:sticky;top:calc(60px + env(safe-area-inset-top));z-index:20;background:var(--bg);margin:0 -20px;padding:10px 20px 10px;border-bottom:1px solid transparent}
.stick.sh{border-bottom-color:var(--line)}
.days{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.days::-webkit-scrollbar,.fil::-webkit-scrollbar{display:none}
.day{flex:0 0 auto;min-width:68px;padding:8px 12px 9px;border-radius:12px;border:1px solid var(--line2);background:var(--paper);text-align:center;line-height:1.1}
.day small{display:block;font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.day b{display:block;font-family:var(--serif);font-stretch:62.5%;font-weight:400;font-size:26px;color:var(--ink);margin-top:2px}
.day.on{background:var(--ink);border-color:var(--ink)}.day.on small{color:var(--gold)}.day.on b{color:#fff}
.day.hj:not(.on){border-color:var(--gold)}.day.hj small::after{content:' · hoje';color:var(--gold-d)}
.fil{display:flex;gap:6px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.fil button{flex:0 0 auto;border:1px solid var(--line2);border-radius:99px;padding:6px 12px;font-size:12.5px;font-weight:600;color:var(--muted);background:var(--paper)}
.fil button.on{background:var(--gold);border-color:var(--gold);color:#fff}
.tema-dia{font-family:var(--serif);font-stretch:62.5%;font-style:italic;font-size:26px;color:var(--gold-d);margin:16px 0 4px}

/* timeline */
.tl{position:relative;margin-top:10px}
.it{display:grid;grid-template-columns:64px 18px 1fr;gap:0 10px;position:relative}
.it .tm{text-align:right;padding-top:14px}
.it .tm b{display:block;font-family:var(--serif);font-stretch:62.5%;font-weight:400;font-size:24px;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}
.it .tm small{display:block;font-size:11.5px;color:var(--muted);margin-top:3px;font-variant-numeric:tabular-nums}
.it .ax{position:relative}
.it .ax::before{content:'';position:absolute;left:8px;top:0;bottom:0;width:1px;background:var(--line2)}
.it:first-child .ax::before{top:20px}.it:last-child .ax::before{bottom:calc(100% - 20px)}
.it .ax::after{content:'';position:absolute;left:4px;top:18px;width:9px;height:9px;border-radius:50%;background:var(--bg);border:1.5px solid var(--gold)}
.it .cd{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:13px 15px;margin:6px 0}
.it.past{opacity:.45}
.it.past .ax::after{background:var(--gold);border-color:var(--gold)}
.it.live .cd{border-color:var(--gold);background:var(--gold-bg);box-shadow:0 6px 22px rgba(168,135,63,.14)}
.it.live .ax::after{width:13px;height:13px;left:2px;top:16px;background:var(--gold);box-shadow:0 0 0 5px rgba(201,168,92,.25)}
.it.prod .cd{background:transparent;border-style:dashed;border-color:var(--line2)}
.it.dark .cd{background:var(--deep);border-color:var(--deep);color:#D8D2C6}
.it.dark .nm{color:#fff}.it.dark .tg{color:#A39C90}.it.dark .ct{color:#D8D2C6}.it.dark .gp,.it.dark .gp.both{color:#A39C90;border-color:rgba(255,255,255,.2)}
.row1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.gp{font-size:9.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:3px 7px;border-radius:5px;border:1px solid currentColor}
.gp.mb{color:var(--mb)}.gp.bm{color:var(--gold-d)}.gp.both{color:var(--muted)}.gp.prod{color:var(--ink2);border-style:dashed}
.tg{font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.lv{margin-left:auto;font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#fff;background:var(--gold-d);border-radius:99px;padding:3px 9px}
.nmrow{display:flex;align-items:center;gap:10px;margin-top:8px}
.nm{font-size:16px;font-weight:700;color:var(--ink);line-height:1.3}
.sm{font-size:13px;color:var(--muted);margin-top:2px}
.ct{font-size:13.5px;color:var(--text);margin-top:6px;line-height:1.45}
.at{font-size:12.5px;font-weight:600;color:var(--gold-t);margin-top:7px}
.spon{display:inline-block;margin-top:8px;font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-t);border:1px solid var(--gold);border-radius:99px;padding:3px 10px}
.it.dark .spon{color:var(--gold);border-color:rgba(201,168,92,.5)}
.pb{height:3px;background:rgba(22,21,19,.08);border-radius:2px;margin-top:11px;overflow:hidden}.pb i{display:block;height:100%;background:var(--gold)}
.more{display:block;width:100%;margin:6px 0 4px 92px;width:calc(100% - 92px);text-align:left;font-size:13px;font-weight:600;color:var(--gold-t);padding:8px 0}
.vazio{padding:40px 0;text-align:center;color:var(--muted)}

/* avatares */
.av{flex:none;width:40px;height:40px;border-radius:50%;overflow:hidden;border:1px solid var(--gold);background:var(--sage);display:inline-grid;place-items:center;font-family:var(--serif);font-stretch:62.5%;font-size:18px;color:var(--gold-d);padding:0}
.av img{width:100%;height:100%;object-fit:cover;object-position:center 22%;display:block}
.av.md{width:56px;height:56px;font-size:22px}
.av.lg{width:84px;height:84px;font-size:32px}
.av.xl{width:120px;height:120px;font-size:44px}
.avs{display:flex}.avs .av+.av{margin-left:-10px}

/* agora */
.now{background:var(--deep);color:#D8D2C6;border-radius:18px;padding:20px;margin-bottom:12px;position:relative;overflow:hidden}
.now::before{content:'';position:absolute;inset:0;border:1px solid rgba(201,168,92,.4);border-radius:18px;pointer-events:none}
.lbl{display:flex;align-items:center;gap:10px;font-size:10.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.lbl .dot{width:7px;height:7px;border-radius:50%;background:#E0574A;animation:pulse 1.6s infinite}
.lbl .r{margin-left:auto;letter-spacing:.08em}
.now .tit{font-family:var(--serif);font-stretch:62.5%;font-size:40px;line-height:1.02;color:#fff;margin-top:12px}
.now .sm{color:#A39C90}.now .nm{color:#F4F1EA}.now .ct{color:#D8D2C6}.now .at{color:var(--gold)}.now .gp.both{color:#A39C90}.now .gp.bm{color:var(--gold)}.now .gp.mb{color:#7CC0AE}.now .tg{color:#A39C90}
.now .pb{background:rgba(255,255,255,.14)}
.now .bio{margin-top:14px;padding-top:14px;border-top:1px solid rgba(255,255,255,.12);font-size:13px;line-height:1.6;color:#D8D2C6}
.now .avs{margin-top:14px}
.nx{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:18px 20px;margin-bottom:12px}
.nx .lbl{color:var(--gold-t)}
.nx .tit{font-family:var(--serif);font-stretch:62.5%;font-size:30px;line-height:1.05;color:var(--ink);margin-top:10px}
.pnow{background:transparent;border:1px dashed var(--gold);border-radius:14px;padding:11px 14px;margin-bottom:10px;font-size:13.5px;color:var(--ink)}
.pnow b{font-weight:700;margin:0 6px}
.pnow .sm{font-size:12px}
.later{margin-top:22px}
.later h4{font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-t);margin-bottom:6px}
.lt{display:flex;gap:12px;align-items:baseline;padding:11px 0;border-bottom:1px solid var(--line)}
.lt b{font-family:var(--serif);font-stretch:62.5%;font-weight:400;font-size:22px;color:var(--ink);min-width:56px;font-variant-numeric:tabular-nums}
.lt span{font-size:14.5px;color:var(--ink);font-weight:600}.lt em{font-style:normal;display:block;font-size:12.5px;color:var(--muted);font-weight:400}
.cta{display:inline-flex;align-items:center;gap:8px;margin-top:18px;padding:11px 16px;border-radius:10px;background:var(--ink);color:#fff;font-size:14px;font-weight:600}

/* palestrantes */
.pgrp{margin-top:22px}
.pgrp h4{display:flex;align-items:center;gap:12px;font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-t);margin-bottom:12px}
.pgrp h4::after{content:'';flex:1;height:1px;background:var(--line2)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.pc{display:flex;gap:14px;align-items:center;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px;transition:border-color .2s,transform .2s}
.pc:hover{border-color:var(--gold);transform:translateY(-1px)}
.pc .pn{font-family:var(--serif);font-stretch:62.5%;font-size:24px;line-height:1.02;color:var(--ink)}
.pc .ph{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-t);margin-top:5px}
.pc .pt{font-size:12.5px;color:var(--muted);margin-top:5px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pend{display:inline-block;margin-top:6px;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--danger)}

/* ficha do palestrante (sheet) */
.sheet{position:fixed;inset:0;z-index:60;background:rgba(12,11,10,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.sh-in{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 22px calc(26px + env(safe-area-inset-bottom));animation:up .25s ease}
@keyframes up{from{transform:translateY(30px);opacity:0}}
@media(min-width:760px){.sheet{align-items:center}.sh-in{border-radius:22px;max-height:86vh}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line2);margin:0 auto 14px}
.shx{float:right;width:34px;height:34px;border-radius:50%;background:var(--paper);border:1px solid var(--line);font-size:18px}
.shh{display:flex;gap:18px;align-items:center;clear:both}
.shh h2{font-family:var(--serif);font-stretch:62.5%;font-weight:400;font-size:38px;line-height:1;color:var(--ink)}
.shh .ph{font-size:11.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-t);margin-top:6px}
.bts{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.bt{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:10px;border:1px solid var(--line2);font-size:13px;font-weight:600;color:var(--ink);text-decoration:none;background:var(--paper)}
.bt.dk{background:var(--ink);color:#fff;border-color:var(--ink)}
.fld{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.fh{display:flex;align-items:center;justify-content:space-between;gap:8px}
.fh span{font-size:10.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-t)}
.cp{border:1px solid var(--line2);border-radius:7px;padding:5px 11px;font-size:11.5px;font-weight:600;color:var(--ink2);background:var(--paper)}
.cp.ok{color:var(--mb);border-color:var(--mb)}
.fld p{font-size:14px;line-height:1.6;color:var(--text);margin-top:6px}
.na{color:var(--muted);font-style:italic}

/* lightbox */
#lb{position:fixed;inset:0;z-index:80;background:rgba(12,11,10,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px}
#lb[hidden]{display:none}
#lb img{max-width:min(92vw,720px);max-height:76vh;border-radius:12px;object-fit:contain}
#lb .lbn{font-family:var(--serif);font-stretch:62.5%;font-size:30px;color:#fff}
#lb .lbx{position:absolute;top:calc(14px + env(safe-area-inset-top));right:16px;color:#fff;font-size:32px}
#lb a{color:var(--gold);font-size:13px;font-weight:600}

/* nav inferior (celular) */
.tabbar{display:none}
.foot{text-align:center;font-size:10.5px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-t);margin-top:30px}

@media(max-width:760px){
 .menu,.bar .stt{display:none}
 .bar-in{height:54px;padding:0 16px}
 .clk{font-size:26px}
 .wrap{padding:16px 16px calc(var(--nav) + 28px + env(safe-area-inset-bottom))}
 .stick{top:calc(54px + env(safe-area-inset-top));margin:0 -16px;padding:10px 16px}
 .h1{font-size:40px}
 .hero{margin-bottom:10px}
 .kick::after{display:none}
 .it{grid-template-columns:50px 14px 1fr;gap:0 8px}
 .it .tm b{font-size:21px}
 .it .ax::before{left:6px}.it .ax::after{left:2px}.it.live .ax::after{left:0}
 .more{margin-left:72px;width:calc(100% - 72px)}
 .now .tit{font-size:34px}
 .nx .tit{font-size:26px}
 .pgrid{grid-template-columns:1fr}
 .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
 .tabbar button{flex:1;height:var(--nav);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:600;color:var(--muted)}
 .tabbar svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7}
 .tabbar button.on{color:var(--ink)}
 .tabbar button.on svg{stroke:var(--gold-d)}
 .tabbar .ld{position:relative}.tabbar .ld::after{content:'';position:absolute;top:-1px;right:-3px;width:7px;height:7px;border-radius:50%;background:var(--danger)}
 .shh h2{font-size:32px}
}

function parseCSV(t){

}

    if(a.indexOf(b)>-1)return true;var sob=b.split(/\s+/).pop();if(sob.length>3&&new RegExp('\\b'+sob+'\\b').test(a))return true;
    var pr=b.split(/\s+/)[0];if(pr.length<4||!new RegExp('\\b'+pr+'\\b').test(a))return false;
    return GENTE.filter(function(q){return norm(q.nome).split(/\s+/)[0]===pr;}).length===1;});
}

/* ===================== interface ===================== */
var ABA='agora', DIA='', MOSTRAR_ANT=false, ULT=0;
var ICON={
  agora:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  programacao:'<svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>',
  palestrantes:'<svg viewBox="0 0 24 24"><circle cx="12" cy="9" r="3.5"/><path d="M5 20c1.2-3.6 4-5 7-5s5.8 1.4 7 5"/></svg>'
};
function fm(m){m=Math.max(0,Math.ceil(m));return m>=60?Math.floor(m/60)+'h'+(m%60?String(m%60).padStart(2,'0'):''):m+' min';}
function diaHoje(){var h=relogio();return DIAS.filter(function(d){return d.data===h.data;})[0];}
function iniciais(n){return esc(n.split(/\s+/).map(function(x){return x[0];}).slice(0,2).join(''));}
function avSpan(g,cls){var f=fotoURL(g.foto,'w300');return '<span class="av '+(cls||'')+'">'+(f?'<img src="'+f+'" alt="" loading="lazy" onerror="this.remove()">':iniciais(g.nome))+'</span>';}
function ehPalestra(d){return /^(palestra|painel)/i.test(d.ato)&&d.resp;}
function titulo(d){return ehPalestra(d)?d.resp:d.ato;}
function subt(d){return ehPalestra(d)?d.ato:d.resp;}

function go(a){ABA=a;MOSTRAR_ANT=false;try{history.replaceState(null,'','#'+a);}catch(e){}render();window.scrollTo(0,0);}
function setDia(d){DIA=d;MOSTRAR_ANT=false;render();}

function nav(){
  var hj=diaHoje(), items=[['agora','Agora'],['programacao','Programação'],['palestrantes','Palestrantes']];
  document.getElementById('menu').innerHTML=items.map(function(x){return '<button class="'+(ABA===x[0]?'on':'')+'" onclick="go(\''+x[0]+'\')">'+(x[0]==='agora'&&hj?'<span class="dot"></span>':'')+x[1]+'</button>';}).join('');
  document.getElementById('tabbar').innerHTML=items.map(function(x){return '<button class="'+(ABA===x[0]?'on':'')+'" onclick="go(\''+x[0]+'\')"><span class="'+(x[0]==='agora'&&hj?'ld':'')+'">'+ICON[x[0]]+'</span>'+x[1]+'</button>';}).join('');
  var h1={agora:'Acontecendo <em>agora</em>',programacao:'Cronograma <em>ao vivo</em>',palestrantes:'Palestrantes <em>do encontro</em>'};
  document.getElementById('h1').innerHTML=h1[ABA];
}

function filtros(){
  return '<div class="fil">'+[['todos','Tudo'],['bm','BlackMonster'],['mb','Make Brazil'],['prod','Produção']].map(function(f){return '<button class="'+(FILTRO===f[0]?'on':'')+'" onclick="setFiltro(\''+f[0]+'\')">'+f[1]+'</button>';}).join('')+'</div>';
}

/* ---------- item da linha do tempo ---------- */
function item(d,est,t){
  var gs=acharGente(d.resp).filter(function(g){return g.foto;});
  var cls='it'+(est?' '+est:'')+(d.g==='prod'?' prod':'')+(/^[A-ZÀ-Ú\s]{6,}$/.test(d.ato)?' dark':'');
  var p=est==='live'?Math.min(100,Math.max(0,(t-d.ini)/(d.fim-d.ini)*100)):0;
  return '<div class="'+cls+'"><div class="tm"><b>'+hhmm(d.ini)+'</b><small>'+hhmm(d.fim)+'</small></div><div class="ax"></div><div class="cd">'+
    '<div class="row1"><span class="gp '+d.g+'">'+GNOME[d.g]+'</span>'+(d.loc?'<span class="tg">'+esc(d.loc)+'</span>':'')+(est==='live'?'<span class="lv">agora · faltam '+fm(d.fim-t)+'</span>':'')+'</div>'+
    '<div class="nmrow">'+(gs.length?'<span class="avs">'+gs.map(function(g){return avatar(g);}).join('')+'</span>':'')+'<div><div class="nm">'+esc(titulo(d))+'</div>'+(subt(d)?'<div class="sm">'+esc(subt(d))+'</div>':'')+'</div></div>'+
    (d.cont?'<div class="ct">'+esc(d.cont)+'</div>':'')+
    (d.obs?'<div class="at">⚑ '+esc(d.obs)+'</div>':'')+
    (d.pat?'<span class="spon">Oferecimento '+esc(d.pat)+'</span>':'')+
    (est==='live'?'<div class="pb"><i style="width:'+p+'%"></i></div>':'')+
    '</div></div>';
}

/* ---------- cartões do "agora" ---------- */
function cartao(d,tipo,t){
  var gs=acharGente(d.resp);
  if(tipo==='now'&&d.g==='prod'&&FILTRO!=='prod')
    return '<div class="pnow"><span class="gp prod">Produção</span><b>'+esc(d.ato)+'</b><div class="sm">'+hhmm(d.ini)+'–'+hhmm(d.fim)+(d.loc?' · '+esc(d.loc):'')+' · faltam '+fm(d.fim-t)+'</div>'+(d.obs?'<div class="at">⚑ '+esc(d.obs)+'</div>':'')+'</div>';
  var p=Math.min(100,Math.max(0,(t-d.ini)/(d.fim-d.ini)*100));
  var bio=tipo==='now'?gs.filter(function(g){return g.bio;}).map(function(g){return '<b style="color:#fff">'+esc(g.nome)+'</b><br>'+escBr(g.bio);}).join('<br><br>'):'';
  var fotos=gs.filter(function(g){return g.foto;});
  return '<div class="'+(tipo==='now'?'now':'nx')+'">'+
    '<div class="lbl">'+(tipo==='now'?'<span class="dot"></span>Acontecendo agora':'A seguir')+'<span class="r">'+(tipo==='now'?'faltam '+fm(d.fim-t):'em '+fm(d.ini-t))+'</span></div>'+
    (fotos.length?'<div class="avs">'+fotos.map(function(g){return avatar(g,tipo==='now'?'lg':'md');}).join('')+'</div>':'')+
    '<div class="tit">'+esc(titulo(d))+'</div>'+
    (subt(d)?'<div class="nm" style="margin-top:6px">'+esc(subt(d))+'</div>':'')+
    (d.cont?'<div class="ct">'+esc(d.cont)+'</div>':'')+
    '<div class="row1" style="margin-top:10px"><span class="gp '+d.g+'">'+GNOME[d.g]+'</span><span class="tg">'+hhmm(d.ini)+'–'+hhmm(d.fim)+(d.loc?' · '+esc(d.loc):'')+'</span></div>'+
    (d.obs?'<div class="at">⚑ '+esc(d.obs)+'</div>':'')+
    (tipo==='now'?'<div class="pb"><i style="width:'+p+'%"></i></div>':'')+
    (bio?'<div class="bio">'+bio+'</div>':'')+
    '</div>';
}

function vAgora(){
  var h=relogio(), hj=diaHoje();
  if(!hj){
    var prox=DIAS.filter(function(d){return d.data>h.data;})[0];
    if(!prox) return '<div class="nx"><div class="lbl">Encontro</div><div class="tit">Encontro encerrado</div><button class="cta" onclick="go(\'programacao\')">Ver a programação</button></div>';
    var dd=Math.round((new Date(prox.data+'T12:00')-new Date(h.data+'T12:00'))/864e5), f=(GRADE[prox.aba]||[])[0];
    return '<div class="now"><div class="lbl">Contagem</div><div class="tit">'+(dd===1?'Começa amanhã':'Faltam '+dd+' dias')+'</div>'+
      '<div class="ct">'+esc(prox.aba)+' · '+esc(prox.tema)+(f?'<br>Primeira atividade às '+hhmm(f.ini)+': '+esc(f.ato):'')+'</div></div>'+
      '<button class="cta" onclick="DIA=\''+prox.aba+'\';go(\'programacao\')">Ver a programação completa →</button>';
  }
  var t=h.min+h.seg/60, lista=(GRADE[hj.aba]||[]).filter(passa);
  var atuais=lista.filter(function(d){return t>=d.ini&&t<d.fim;}).sort(function(a,b){return (a.g==='prod')-(b.g==='prod');});
  var fut=lista.filter(function(d){return d.ini>t;}), pIni=fut.length?fut[0].ini:null, prox=fut.filter(function(d){return d.ini===pIni;});
  var L='<div class="tema-dia" style="margin-top:0">'+esc(hj.aba)+' · '+esc(hj.tema)+'</div>'+filtros()+'<div style="height:12px"></div>';
  if(atuais.length) atuais.forEach(function(d){L+=cartao(d,'now',t);});
  else L+='<div class="nx"><div class="lbl">Agora</div><div class="tit">'+(lista.length&&t<lista[0].ini?'O dia ainda não começou':prox.length?'Intervalo':'Dia encerrado')+'</div></div>';
  prox.forEach(function(d){L+=cartao(d,'next',t);});
  var depois=fut.filter(function(d){return d.ini!==pIni;}).slice(0,4);
  if(depois.length) L+='<div class="later"><h4>Depois</h4>'+depois.map(function(d){return '<div class="lt"><b>'+hhmm(d.ini)+'</b><div><span>'+esc(titulo(d))+'</span><em>'+esc([subt(d),d.loc].filter(Boolean).join(' · '))+'</em></div></div>';}).join('')+'</div>';
  L+='<button class="cta" onclick="DIA=\''+hj.aba+'\';go(\'programacao\')">Ver o dia completo →</button>';
  return L;
}

function vProg(){
  var h=relogio(), dia=DIAS.filter(function(d){return d.aba===DIA;})[0]||DIAS[0], eHoje=dia.data===h.data, t=eHoje?h.min+h.seg/60:-1;
  var lista=(GRADE[dia.aba]||[]).filter(passa);
  var S='<div class="stick" id="stick"><div class="days">'+DIAS.map(function(d){var p=d.aba.split(' ');return '<button class="day'+(d.aba===dia.aba?' on':'')+(d.data===h.data?' hj':'')+'" onclick="setDia(\''+d.aba+'\')"><small>'+esc(p[0])+'</small><b>'+esc(p[1]||'')+'</b></button>';}).join('')+'</div>'+filtros()+'</div>';
  S+='<div class="tema-dia">'+esc(dia.tema)+'</div>';
  if(!lista.length) return S+'<div class="vazio">Nada nesse filtro.</div>';
  var passados=eHoje?lista.filter(function(d){return t>=d.fim;}):[];
  var B='<div class="tl">';
  if(passados.length>2&&!MOSTRAR_ANT){B+='<button class="more" onclick="MOSTRAR_ANT=true;render()">+ '+passados.length+' atividades que já passaram</button>';}
  lista.forEach(function(d){
    var est=eHoje?(t>=d.fim?'past':(t>=d.ini?'live':'')):(dia.data<h.data?'past':'');
    if(est==='past'&&eHoje&&passados.length>2&&!MOSTRAR_ANT)return;
    B+=item(d,est,t);
  });
  return S+B+'</div>';
}

function vPal(){
  var ord=[], grp={};
  GENTE.forEach(function(g){var k=(g.dia||'Outros').split('/')[0].trim(); if(!grp[k]){grp[k]=[];ord.push(k);} grp[k].push(g);});
  return ord.map(function(k){
    return '<div class="pgrp"><h4>'+esc(k)+'</h4><div class="pgrid">'+grp[k].map(function(g){var i=GENTE.indexOf(g);
      return '<button class="pc" onclick="abrirFicha('+i+')">'+avSpan(g,'md')+'<div><div class="pn">'+esc(g.nome)+'</div><div class="ph">'+esc([g.dia,g.hora].filter(Boolean).join(' · '))+'</div>'+(g.tema?'<div class="pt">'+esc(g.tema)+'</div>':'')+(!g.bio?'<span class="pend">bio pendente</span>':'')+'</div></button>';
    }).join('')+'</div></div>';
  }).join('');
}

function abrirFicha(i){
  var g=GENTE[i]; if(!g)return;
  function fld(rot,txt,html,copia){if(!txt&&!html)return '';
    return '<div class="fld"><div class="fh"><span>'+rot+'</span>'+(copia&&txt?'<button class="cp" onclick="copiar(this,'+JSON.stringify(txt).replace(/"/g,'&quot;')+')">copiar</button>':'')+'</div><p>'+(html||escBr(txt))+'</p></div>';}
  var bts=(g.foto?'<a class="bt" href="'+esc(g.foto)+'" target="_blank" rel="noopener">Foto ↗</a>':'')+(g.evento?'<a class="bt dk" href="'+esc(g.evento)+'" target="_blank" rel="noopener">Fotos do evento ↗</a>':'')+(/^https?:/i.test(g.link)?'<a class="bt" href="'+esc(g.link)+'" target="_blank" rel="noopener">Apresentação ↗</a>':'');
  document.getElementById('shin').innerHTML='<div class="grab"></div><button class="shx" onclick="fecharFicha()" aria-label="Fechar">×</button>'+
    '<div class="shh">'+(g.foto?avatar(g,'xl'):avSpan(g,'xl'))+'<div><h2>'+esc(g.nome)+'</h2><div class="ph">'+esc([g.dia,g.hora].filter(Boolean).join(' · '))+'</div></div></div>'+
    (bts?'<div class="bts">'+bts+'</div>':'')+
    fld('Tema da palestra',g.tema,'',true)+
    fld('Bio',g.bio||'','',true)+(g.bio?'':'<div class="fld"><div class="fh"><span>Bio</span></div><p class="na">pendente</p></div>')+
    (g.link&&!/^https?:/i.test(g.link)?fld('Apresentação',g.link):'')+
    fld('Produção',g.obs);
  document.getElementById('sheet').hidden=false; document.body.style.overflow='hidden';
}
function fecharFicha(){document.getElementById('sheet').hidden=true;document.body.style.overflow='';}
document.addEventListener('keydown',function(e){if(e.key==='Escape')fecharFicha();});

function render(){
  nav();
  var v=document.getElementById('view');
  v.innerHTML=ABA==='agora'?vAgora():ABA==='palestrantes'?vPal():vProg();
  ULT=Date.now();
}
window.addEventListener('scroll',function(){var s=document.getElementById('stick');if(s)s.classList.toggle('sh',window.scrollY>140);},{passive:true});
function gviz(aba){return 'https://docs.google.com/spreadsheets/d/'+SHEET+'/gviz/tq?tqx=out:csv&headers=1&sheet='+encodeURIComponent(aba)+'&t='+Date.now();}
function get(aba){
  return fetch(gviz(aba),{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.text();})
    .then(function(x){if(/^\s*</.test(x)||/google\.visualization/.test(x))throw 1;return x;});
}
function espera(ms){return new Promise(function(r){setTimeout(r,ms);});}
async function busca(aba){try{return await get(aba);}catch(e){await espera(600);try{return await get(aba);}catch(e2){return null;}}}

async function atualizar(){
  if(SHEET.indexOf('__')===0){document.getElementById('stt').textContent='Planilha não conectada · usando cópia embutida';return;}
  document.getElementById('stt').textContent='Buscando…';
  var falta=[],ok=0;
  for(var k=0;k<DIAS.length;k++){
    var txt=await busca(DIAS[k].aba),g=txt?parseDia(txt):null;
    if(g){GRADE[DIAS[k].aba]=g;ok++;}else falta.push(DIAS[k].aba);
    await espera(250);
  }
  var tp=await busca(ABA_BIO),gp=tp?parseGente(tp):null;
  if(gp)GENTE=gp;else falta.push(ABA_BIO);
  var d=new Date(),hora=d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  var s=document.getElementById('stt');
  s.textContent=!falta.length?'Atualizado às '+hora:ok===0&&!gp?'Sem acesso à planilha · usando cópia embutida':'Faltou a aba '+falta.join(', ')+' · '+hora;
  s.style.color=falta.length?'var(--danger)':'';
  render();
}

(function(){
  var _at=atualizar;
  atualizar=async function(){var b=document.getElementById('sync');b.classList.add('load');b.classList.remove('err');
    await _at(); b.classList.remove('load'); if(/Faltou|Sem acesso/.test(document.getElementById('stt').textContent))b.classList.add('err');};
  DIAS.forEach(function(d){GRADE[d.aba]=parseDia(SEED.dias[d.aba])||[];});
  GENTE=parseGente(SEED.bio)||[];
  var h=relogio(),hj=diaHoje(),fut=DIAS.filter(function(d){return d.data>h.data;})[0];
  DIA=(hj||fut||DIAS[DIAS.length-1]).aba;
  var hs=(location.hash||'').slice(1); ABA=['agora','programacao','palestrantes'].indexOf(hs)>-1?hs:(hj?'agora':'programacao');
  render(); atualizar();
  setInterval(atualizar,120000);
  setInterval(function(){var h=relogio();document.getElementById('clk').textContent=hhmm(h.min);
    if(ABA!=='palestrantes'&&document.getElementById('sheet').hidden&&Date.now()-ULT>30000)render();},1000);
})();
</script>
</body></html>
