<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F4F3EF">
<title>BlackMonster · Cronograma ao vivo</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Display:ital,wdth,wght@0,62.5,400;0,62.5,500;1,62.5,400&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
:root{--ink:#161513;--ink2:#2B2925;--deep:#0C0B0A;--text:#47443E;--muted:#77726A;--bg:#F4F3EF;--paper:#FFFFFF;--sage:#ECE7DD;--line:rgba(22,21,19,.12);--gold:#C9A85C;--gold-d:#A8873F;--gold-t:#8A6D2F;--mb:#3F7D6E;--danger:#B3412B;
 --serif:'Noto Serif Display',Georgia,serif;--sans:'DM Sans',system-ui,-apple-system,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);padding:22px;min-height:100vh;-webkit-font-smoothing:antialiased}
.wrap{max-width:1100px;margin:0 auto}
.serif,h1,.tit,.card h3,.tema-dia{font-family:var(--serif);font-stretch:62.5%;font-weight:400;color:var(--ink)}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.logo{display:block;height:22px;width:auto;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:12px;font-size:11.5px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-t)}
.brand::after{content:'';width:44px;height:1px;background:var(--gold)}
h1{font-size:clamp(40px,6vw,64px);line-height:.98;margin-top:8px}
h1 em{font-style:italic;color:var(--gold-d)}
.sub2{font-size:14px;font-weight:500;color:var(--text);margin-top:8px}
.acts{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.clock{font-family:var(--serif);font-stretch:62.5%;font-size:48px;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1;text-align:right}
.clock small{display:block;font-family:var(--sans);font-size:10px;font-weight:600;letter-spacing:.2em;color:var(--gold-t);text-transform:uppercase;margin-top:4px}
button{font-family:inherit;cursor:pointer}
.rf{display:inline-flex;align-items:center;gap:10px;background:var(--ink);color:#fff;border:0;padding:13px 22px;border-radius:6px;font-size:14px;font-weight:600}
.rf span{font-size:15px;line-height:1;color:var(--gold)}
.rf:active{transform:translateY(1px)}
.stt{font-size:11.5px;font-weight:500;color:var(--muted);text-align:right}
.tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.tab{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:9px 16px;font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tab.hj:not(.on){border-color:var(--gold);color:var(--gold-t)}
.tema-dia{font-style:italic;font-size:26px;color:var(--gold-d);margin:0 0 14px}
.now{background:var(--deep);color:#F4F1EA;border-radius:10px;padding:20px 22px;margin-bottom:10px;position:relative;overflow:hidden}
.now::before{content:'';position:absolute;inset:0;border:1px solid rgba(201,168,92,.45);border-radius:10px;pointer-events:none}
.next{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:16px 20px;margin-bottom:10px}
.lbl{display:flex;align-items:center;gap:10px;font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:8px}
.next .lbl{color:var(--gold-t)}
.tit{font-size:34px;line-height:1.02;margin-top:6px}
.now .tit{color:#fff}
.next .tit{font-size:26px}
.meta{font-size:12.5px;color:var(--muted);margin-top:6px;font-weight:500}
.now .meta{color:#A39C90}
.desc{font-size:10.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.now .desc{color:#A39C90}
.nom{font-size:15px;font-weight:700;color:var(--ink);margin-top:4px;line-height:1.3}
.now .nom{color:#F4F1EA}
.cont{font-size:13.5px;font-weight:500;color:var(--text);margin-top:4px;line-height:1.5}
.cont.big{font-size:15px;margin-top:8px}
.now .cont{color:#D8D2C6}
.at{color:var(--gold-t);font-size:12.5px;font-weight:600;margin-top:6px;line-height:1.4}
.now .at{color:var(--gold)}
.bio{font-size:13px;line-height:1.6;color:#D8D2C6;margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.12)}
.next .bio{color:var(--text);border-top-color:var(--line)}
.prog{height:3px;background:rgba(255,255,255,.14);border-radius:2px;overflow:hidden;margin-top:14px}
.prog i{display:block;height:100%;background:var(--gold);width:0}
.cd{margin-left:auto;font-size:12px;font-weight:600;letter-spacing:.08em;color:var(--gold);font-variant-numeric:tabular-nums}
.next .cd{color:var(--gold-t)}
.gp{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:3px 8px;border-radius:4px;margin-right:8px;vertical-align:1px;border:1px solid currentColor}
.gp.mb{color:var(--mb)}.gp.bm{color:var(--gold-d)}.gp.both{color:var(--muted)}
.now .gp.both{color:#A39C90}.now .gp.bm{color:var(--gold)}.now .gp.mb{color:#7CC0AE}
.spon{display:inline-block;margin-top:8px;font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-t);border:1px solid var(--gold);border-radius:99px;padding:3px 10px}
table{width:100%;border-collapse:collapse;background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:10px}
th{font-size:10.5px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-t);text-align:left;padding:12px 14px;border-bottom:1px solid var(--line)}
td{padding:13px 14px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
tr:last-child td{border-bottom:0}
tr.done{opacity:.4}
tr.live td{background:#FBF6EA}
tr.live td:first-child{box-shadow:inset 3px 0 0 var(--gold)}
.h{font-family:var(--serif);font-stretch:62.5%;font-size:22px;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap;line-height:1}
.h small{display:block;font-family:var(--sans);font-size:11.5px;color:var(--muted);font-weight:500;margin-top:4px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:18px}
.ch{display:flex;align-items:center;gap:14px}
.av{flex:none;width:64px;height:64px;border-radius:50%;overflow:hidden;padding:0;border:1px solid var(--gold);background:var(--sage);cursor:zoom-in;display:inline-flex;align-items:center;justify-content:center;font-family:var(--serif);font-stretch:62.5%;font-size:24px;color:var(--gold-d)}
.av img{width:100%;height:100%;object-fit:cover;object-position:center 22%;display:block}
.av.vazio{cursor:default}
.av.lg{width:56px;height:56px}
.avs{display:flex;gap:8px;margin:10px 0 2px}
.bts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.bt{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:6px;border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--ink);text-decoration:none;background:var(--paper)}
.bt:hover{border-color:var(--gold)}
.bt.ev{background:var(--ink);color:#fff;border-color:var(--ink)}
#lb{position:fixed;inset:0;z-index:50;background:rgba(12,11,10,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px}
#lb[hidden]{display:none}
#lb img{max-width:min(92vw,720px);max-height:76vh;border-radius:10px;object-fit:contain;background:#1b1a18}
#lb .lbn{font-family:var(--serif);font-stretch:62.5%;font-size:30px;color:#fff}
#lb .lbx{position:absolute;top:14px;right:16px;background:none;border:0;color:#fff;font-size:30px;line-height:1;cursor:pointer}
#lb a{color:var(--gold);font-size:13px;font-weight:600}
.card h3{font-size:30px;line-height:1.02}
.card .tema{font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--gold-t);margin-top:8px}
.card p{font-size:13.5px;line-height:1.6;color:var(--text);margin-top:4px}
.fld{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.fh{display:flex;align-items:center;justify-content:space-between;gap:8px}
.fh span{font-size:10.5px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-t)}
.cp{background:transparent;border:1px solid var(--line);color:var(--ink2);font-size:11px;font-weight:600;padding:5px 11px;border-radius:5px}
.cp.ok{color:var(--mb);border-color:var(--mb)}
.lk{color:var(--ink);font-size:13.5px;font-weight:600;text-decoration:none;border-bottom:1px solid var(--gold)}
.na{color:var(--muted);font-size:13px;font-style:italic}
.err{color:var(--danger);font-size:12px;font-weight:600;padding:8px 0;line-height:1.5}
.foot{display:flex;align-items:center;justify-content:center;gap:12px;font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-t);margin-top:26px}
.foot::before,.foot::after{content:'';width:44px;height:1px;background:var(--gold)}
@media(max-width:700px){
 body{padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
 .top{gap:14px;margin-bottom:16px;padding-bottom:14px}
 .ttl{flex:1 1 100%}
 .logo{height:18px}
 .acts{flex:1 1 100%;flex-direction:row;align-items:center;justify-content:space-between;flex-wrap:wrap}
 .clock,.clock small{text-align:left}
 .clock{font-size:40px}
 .stt{flex:1 1 100%;text-align:left}
 h1{font-size:44px}
 .tabs{overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch;scrollbar-width:none;margin:0 -16px 14px;padding:0 16px}
 .tabs::-webkit-scrollbar{display:none}
 .tab{flex:0 0 auto;padding:10px 15px}
 .now{padding:16px}.next{padding:14px 16px}
 .tit{font-size:30px}.next .tit{font-size:23px}
 .lbl{flex-wrap:wrap}
 .cd{margin-left:0;flex:1 1 100%}
 table,tbody,tr,td{display:block;width:100%}
 table{border:0;background:transparent}
 tr{background:var(--paper);border:1px solid var(--line);border-radius:10px;margin-bottom:8px;padding:14px;display:flex!important;gap:14px;align-items:flex-start}
 tr:first-child{display:none!important}
 tr.live{border-color:var(--gold);background:#FBF6EA}
 tr.live td{background:none}
 tr.live td:first-child{box-shadow:none}
 td{border:0;padding:0}
 td:first-child{flex:0 0 56px}
 td:nth-child(2){flex:1}
 .cards{grid-template-columns:1fr}
 .card h3{font-size:32px}
}

function relogio(){

}
function parseCSV(t){
  t=t.replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  var rows=[],row=[],cur='',q=false;
  for(var i=0;i<t.length;i++){var c=t[i];
    if(q){if(c=='"'){if(t[i+1]=='"'){cur+='"';i++;}else q=false;}else cur+=c;}
    else if(c=='"')q=true; else if(c==','){row.push(cur);cur='';} else if(c=='\n'){row.push(cur);rows.push(row);row=[];cur='';} else cur+=c;}
  row.push(cur);rows.push(row);return rows;
}

function parseDia(txt){

  for(var r=0;r<rows.length;r++){var x=rows[r];if(!x.join('').trim())continue;
    if(/hora inicial/.test(norm(x[0]))){

           l:col(x,['local']),r:col(x,['responsavel','palestrante']),o:col(x,['atencao','obs']),p:col(x,['patrocinio'])};continue;}
    var ini=mins(x[0]);
    if(ini!==null&&!map)map={f:1,a:3,d:4,g:5,l:6,r:7,o:8,p:9};
    if(ini===null||!map)continue;
    var v=function(k){return map[k]>-1?(x[map[k]]||'').trim():'';};
    if(!v('a'))continue;
    out.push({ini:ini,fim:mins(v('f')),ato:v('a'),cont:v('d'),g:grupo(v('g')),loc:v('l'),resp:v('r'),obs:v('o'),pat:v('p')});

  out.sort(function(a,b){return a.ini-b.ini;});

}
function parseGente(txt){

}

  return '<div class="'+(tipo==='now'?'now':'next')+'"><div class="lbl">'+lbl+'<span class="cd">'+cd+'</span></div>'+
    '<div class="desc"><span class="gp '+d.g+'">'+GNOME[d.g]+'</span>'+esc(d.loc||'')+'</div>'+
    (gs.some(function(g){return g.foto;})?'<div class="avs">'+gs.filter(function(g){return g.foto;}).map(function(g){return avatar(g,'lg');}).join('')+'</div>':'')+
    (/^(palestra|painel)/i.test(d.ato)&&d.resp?'<div class="tit">'+esc(d.resp)+'</div><div class="nom">'+esc(d.ato)+'</div>':'<div class="tit">'+esc(d.ato)+'</div>'+(d.resp?'<div class="nom">'+esc(d.resp)+'</div>':''))+
    (d.cont?'<div class="cont big">'+esc(d.cont)+'</div>':'')+
    '<div class="meta">'+hhmm(d.ini)+'–'+hhmm(d.fim)+'</div>'+
    (d.obs?'<div class="at">⚑ '+esc(d.obs)+'</div>':'')+
    (bio?'<div class="bio">'+bio+'</div>':'')+
    (tipo==='now'?'<div class="prog"><i style="width:'+p+'%"></i></div>':'')+'</div>';
}
function render(){
  tabs();
  if(VIEW==='p'){
    document.getElementById('body').innerHTML='<div class="cards">'+GENTE.map(function(g){
      function fld(rot,txt,html){if(!txt)return '';
        return '<div class="fld"><div class="fh"><span>'+rot+'</span><button class="cp" onclick="copiar(this,'+JSON.stringify(txt).replace(/"/g,'&quot;')+')">copiar</button></div><p>'+(html||escBr(txt))+'</p></div>';}
      var L=g.link?(/^https?:/i.test(g.link)?'<a class="lk" href="'+esc(g.link)+'" target="_blank" rel="noopener">Abrir apresentação</a>':'<span class="na">'+esc(g.link)+'</span>'):'';
      var quando=[g.dia,g.hora].filter(Boolean).join(' · ');
      var bts=(g.foto?'<a class="bt" href="'+esc(g.foto)+'" target="_blank" rel="noopener">Foto do palestrante ↗</a>':'')+(g.evento?'<a class="bt ev" href="'+esc(g.evento)+'" target="_blank" rel="noopener">Fotos do evento ↗</a>':'');
      return '<div class="card"><div class="ch">'+avatar(g)+'<div><h3>'+esc(g.nome)+'</h3>'+(quando?'<div class="tema">'+esc(quando)+'</div>':'')+'</div></div>'+(bts?'<div class="bts">'+bts+'</div>':'')+
        fld('Bio',g.bio)+fld('Tema da palestra',g.tema)+
        (g.obs?'<div class="fld"><div class="fh"><span>Produção</span></div><p>'+escBr(g.obs)+'</p></div>':'')+
        (g.link?fld('Link da apresentação',g.link,L):'<div class="fld"><div class="fh"><span>Link da apresentação</span></div><p><span class="na">não enviado</span></p></div>')+
        '</div>';}).join('')+'</div>';
    return;
  }
  var h=relogio(),dia=DIAS.filter(function(d){return d.aba===VIEW;})[0],eHoje=dia.data===h.data;
  var t=eHoje?h.min+h.seg/60:-1,lista=GRADE[VIEW]||[],L='';
  if(dia.tema)L+='<div class="tema-dia">'+esc(dia.tema)+'</div>';
  if(eHoje){
    var atuais=lista.filter(function(d){return t>=d.ini&&t<d.fim;});
    var futuros=lista.filter(function(d){return d.ini>t;}),pIni=futuros.length?futuros[0].ini:null;
    var prox=futuros.filter(function(d){return d.ini===pIni;});
    if(atuais.length)atuais.forEach(function(d){L+=bloco(d,'now',t);});
    else L+='<div class="now"><div class="lbl">Agora</div><div class="tit">'+(lista.length&&t<lista[0].ini?'Ainda não começou':prox.length?'Intervalo':'Dia encerrado')+'</div></div>';
    prox.forEach(function(d){L+=bloco(d,'next',t);});
  } else {
    L+='<div class="next"><div class="lbl">Programação de '+esc(dia.aba)+' · '+brData(dia.data)+'</div><div class="tit">'+(dia.data>h.data?'Ainda não aconteceu':'Já aconteceu')+'</div><div class="meta">O acompanhamento ao vivo aparece no dia.</div></div>';
  }
  var H='<table><tr><th>Horário</th><th>Atividade</th></tr>';
  lista.forEach(function(d){
    var cls=eHoje?(t>=d.fim?'done':(t>=d.ini?'live':'')):(dia.data<h.data?'done':'');
    H+='<tr class="'+cls+'"><td class="h">'+hhmm(d.ini)+'<small>'+hhmm(d.fim)+'</small></td><td>'+
      '<div class="desc"><span class="gp '+d.g+'">'+GNOME[d.g]+'</span>'+esc(d.loc)+'</div>'+
      '<div class="nom">'+esc(d.ato)+'</div>'+
      (d.resp?'<div class="meta" style="margin-top:3px">'+esc(d.resp)+'</div>':'')+
      (d.cont?'<div class="cont">'+esc(d.cont)+'</div>':'')+
      (d.obs?'<div class="at">⚑ '+esc(d.obs)+'</div>':'')+
      (d.pat?'<span class="spon">Oferecimento '+esc(d.pat)+'</span>':'')+'</td></tr>';
  });
  document.getElementById('body').innerHTML=L+H+'</table>';
}

function gviz(aba){return 'https://docs.google.com/spreadsheets/d/'+SHEET+'/gviz/tq?tqx=out:csv&headers=1&sheet='+encodeURIComponent(aba)+'&t='+Date.now();}
function get(aba){
  return fetch(gviz(aba),{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.text();})
    .then(function(x){if(/^\s*</.test(x)||/google\.visualization/.test(x))throw 1;return x;});
}
function espera(ms){return new Promise(function(r){setTimeout(r,ms);});}
async function busca(aba){try{return await get(aba);}catch(e){await espera(600);try{return await get(aba);}catch(e2){return null;}}}

async function atualizar(){
  if(SHEET.indexOf('__')===0){document.getElementById('stt').textContent='Planilha não conectada · usando cópia embutida';return;}
  document.getElementById('stt').textContent='Buscando…';
  var falta=[],ok=0;
  for(var k=0;k<DIAS.length;k++){
    var txt=await busca(DIAS[k].aba),g=txt?parseDia(txt):null;
    if(g){GRADE[DIAS[k].aba]=g;ok++;}else falta.push(DIAS[k].aba);
    await espera(250);
  }
  var tp=await busca(ABA_BIO),gp=tp?parseGente(tp):null;
  if(gp)GENTE=gp;else falta.push(ABA_BIO);
  var d=new Date(),hora=d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  var s=document.getElementById('stt');
  s.textContent=!falta.length?'Atualizado às '+hora:ok===0&&!gp?'Sem acesso à planilha · usando cópia embutida':'Faltou a aba '+falta.join(', ')+' · '+hora;
  s.style.color=falta.length?'var(--danger)':'';
  render();
}

(function(){
  DIAS.forEach(function(d){GRADE[d.aba]=parseDia(SEED.dias[d.aba])||[];});
  GENTE=parseGente(SEED.bio)||[];
  var h=relogio(),iH=DIAS.findIndex(function(d){return d.data===h.data;});
  var fut=DIAS.findIndex(function(d){return d.data>h.data;});
  VIEW=DIAS[iH>-1?iH:fut>-1?fut:DIAS.length-1].aba;
  render();atualizar();
  setInterval(atualizar,120000);
  setInterval(function(){
    var h=relogio();
    document.getElementById('clk').textContent=hhmm(h.min);
    document.getElementById('dt').textContent=new Date(h.data+'T12:00').toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'2-digit'});
    if(VIEW!=='p')render();
  },1000);
})();
</script>
